[window]
option_as_alt = "OnlyLeft"

[font]
size = 20.0

[font.normal]
family = "JetBrains Mono"

[keyboard]
bindings = [
    { key = "Right", mods = "Alt", chars = "\u001BF" },
    { key = "Left",  mods = "Alt", chars = "\u001BB" },
]

[colors.primary]
background = "#1F1F28"
foreground = "#DCD7BA"
dim_foreground = "#C8C093"
bright_foreground = "#DCD7BA"

[colors.cursor]
text = "#1F1F28"
cursor = "#7E9CD8"

[colors.vi_mode_cursor]
text = "#1F1F28"
cursor = "#E6C384"

[colors.search.matches]
foreground = "#DCD7BA"
background = "#2A2A37"

[colors.search.focused_match]
foreground = "#1F1F28"
background = "#E6C384"

[colors.footer_bar]
