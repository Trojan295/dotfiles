set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'erikw/tmux-powerline'

set -ga terminal-overrides ",$TERM:Tc"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g mouse on

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

unbind '"'
unbind %
bind c new-window -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

set -g mode-style "fg=#DCD7BA,bg=#2A2A37"
set -g message-style "fg=#DCD7BA,bg=#2A2A37"
set -g message-command-style "fg=#DCD7BA,bg=#2A2A37"

set -g pane-border-style "fg=#363646"
set -g pane-active-border-style "fg=#7E9CD8"

set -g window-status-current-format "#[fg=#1F1F28,bg=#7E9CD8] #I:#W "
set -g window-status-format "#[fg=#C8C093,bg=#2A2A37] #I:#W "

set -g @tmux_power_theme '#1F1F28'

run '~/.tmux/plugins/tpm/tpm'

