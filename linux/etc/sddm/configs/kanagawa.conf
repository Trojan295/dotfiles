[General]
scale = 1.0
enable-animations = true
animated-background-placeholder = ""
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 0
padding-left = 0
background = "background.png"
use-background-color = false
background-color = "#1F1F28"
blur = 32
brightness = -0.2
saturation = 1.0

[LockScreen.Clock]
display = true
position = "center"
align = "center"
format = "hh:mm"
font-family = "JetBrains Mono Nerd Font"
font-size = 70
font-weight = 900
color = "#DCD7BA"

[LockScreen.Date]
display = true
format = "dddd, MMMM dd, yyyy"
locale = "en_US"
font-family = "JetBrains Mono Nerd Font"
font-size = 14
font-weight = 600
color = "#7AA89F"
margin-top = -15

[LockScreen.Message]
display = true
position = "bottom-center"
align = "center"
text = "Press any key"
font-family = "JetBrains Mono Nerd Font"
font-size = 12
font-weight = 400
display-icon = true
icon = "enter.svg"
icon-size = 16
color = "#54546D"
paint-icon = true
spacing = 0

[LoginScreen]
background = "background.png"
use-background-color = false
background-color = "#1F1F28"
blur = 32
brightness = -0.2
saturation = 1.0

[LoginScreen.LoginArea]
position = "center"
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = "circle"
border-radius = 35
active-size = 120
inactive-size = 80
inactive-opacity = 0.35
active-border-size = 0
inactive-border-size = 0
active-border-color = "#E6C384"
inactive-border-color = "#E6C384"

[LoginScreen.LoginArea.Username]
font-family = "JetBrains Mono Nerd Font"
font-size = 16
font-weight = 700
color = "#DCD7BA"
margin = 10

[LoginScreen.LoginArea.PasswordInput]
width = 200
height = 30
display-icon = false
font-family = "JetBrains Mono Nerd Font"
font-size = 12
icon = "password.svg"
icon-size = 16
content-color = "#DCD7BA"
background-color = "#2A2A37"
background-opacity = 1.0
border-size = 0
border-color = "#E6C384"
border-radius-left = 10
border-radius-right = 10
margin-top = 10
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
background-color = "#2A2A37"
background-opacity = 1.0
active-background-color = "#E6C384"
active-background-opacity = 1.0
icon = "arrow-right.svg"
icon-size = 18
content-color = "#E6C384"
active-content-color = "#1F1F28"
border-size = 0
border-color = "#E6C384"
border-radius-left = 10
border-radius-right = 10
margin-left = 5
show-text-if-no-password = true
hide-if-not-needed = false
font-family = "JetBrains Mono Nerd Font"
font-size = 12
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Logging in"
font-family = "JetBrains Mono Nerd Font"
font-weight = 600
font-size = 14
icon-size = 30
icon = "spinner.svg"
color = "#DCD7BA"
spacing = 5

[LoginScreen.LoginArea.WarningMessage]
font-family = "JetBrains Mono Nerd Font"
font-size = 11
font-weight = 400
normal-color = "#DCD7BA"
warning-color = "#E6C384"
error-color = "#D27E99"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 0
margin-right = 0
margin-bottom = 100
margin-left = 0
size = 30
border-radius = 10
spacing = 20
font-family = "JetBrains Mono Nerd Font"

[LoginScreen.MenuArea.Popups]
max-height = 230
item-height = 30
item-spacing = 2
padding = 5
display-scrollbar = false
margin = 5
background-color = "#2A2A37"
background-opacity = 1.0
active-option-background-color = "#2A2A37"
active-option-background-opacity = 1.0
content-color = "#DCD7BA"
active-content-color = "#E6C384"
font-family = "JetBrains Mono Nerd Font"
border-size = 0
border-color = "#E6C384"
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-center"
index = 0
popup-direction = "up"
popup-align = "center"
display-session-name = false
button-width = -1
popup-width = 200
background-color = "#E6C384"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#DCD7BA"
active-content-color = "#1F1F28"
border-size = 0
font-size = 10
icon-size = 16

[LoginScreen.MenuArea.Layout]
display = true
position = "bottom-center"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 180
display-layout-name = false
background-color = "#E6C384"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#DCD7BA"
active-content-color = "#1F1F28"
border-size = 0
font-size = 10
icon = "language.svg"
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = true
position = "bottom-center"
index = 0
background-color = "#E6C384"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#DCD7BA"
active-content-color = "#1F1F28"
border-size = 0
icon = "keyboard.svg"
icon-size = 16

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-center"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 100
background-color = "#E6C384"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#DCD7BA"
active-content-color = "#1F1F28"
border-size = 0
icon = "power.svg"
icon-size = 16

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
background-color = "#2A2A37"
background-opacity = 1.0
key-content-color = "#DCD7BA"
key-color = "#2A2A37"
key-opacity = 1.0
key-active-background-color = "#E6C384"
key-active-opacity = 1.0
selection-background-color = "#DCD7BA"
selection-content-color = "#1F1F28"
primary-color = "#E6C384"
border-size = 0
border-color = "#2D4F67"
restrict-input = "none"

[Tooltips]
enable = true
font-family = "JetBrains Mono Nerd Font"
font-size = 11
content-color = "#DCD7BA"
background-color = "#2A2A37"
background-opacity = 1.0
border-radius = 10
disable-user = false
disable-login-button = false
