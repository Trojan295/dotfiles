general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    pam:enabled = true
    pam:module = hyprlock
}

animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = linear, 0, 0, 1, 1

    animation = fade, 1, 2, easeOutQuint
    animation = fadeIn, 1, 2, easeOutQuint
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    color = rgba(1F1F28ff)
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.5
    vibrancy = 0.1696
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(DCD7Baff)
    font_size = 96
    font_family = JetBrains Mono Nerd Font

    position = 0, 120
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(1F1F28cc)
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(7AA89Fff)
    font_size = 24
    font_family = JetBrains Mono Nerd Font

    position = 0, 50
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(54546Dff)
    font_size = 16
    font_family = JetBrains Mono Nerd Font

    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(E6C384ff)
    inner_color = rgba(1F1F28cc)
    font_color = rgba(DCD7Baff)
    font_family = JetBrains Mono Nerd Font

    check_color = rgba(7AA89Fff)
    fail_color = rgba(D27E99ff)

    placeholder_text = <i>password...</i>
    fade_on_empty = true
    fade_timeout = 2000

    rounding = 12

    position = 0, -40
    halign = center
    valign = center
}
